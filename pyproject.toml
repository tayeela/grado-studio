# Конфигурация инструментов разработки. Пока только ruff (аудит 06.11, 1.3 — поэтапно);
# mypy для core/ — следующий шаг того же пункта.
[tool.ruff]
target-version = "py312"
line-length = 200        # в коде длинные строки-правила с источником, не режем

[tool.ruff.lint]
# E4/E7/E9/F — «код сломан»: синтаксис, undefined, неиспользуемое. Стиль (точки с запятой,
# lambda-присваивания, имена) — отдельно и позже, чтобы правка не тонула в сотнях переименований.
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E702", # `;` после короткого оператора с комментарием в хвосте — принятый стиль кода
  "E731", # lambda-присваивания по всему ядру; замена на def — отдельный рефакторинг (этап 5)
  "E741", # однобуквенная l в формулах координат — как в исходных методиках
]

[tool.ruff.lint.isort]
# импорты не пересортируем: порядок местами значим (пути ядра) — I не включён в select
