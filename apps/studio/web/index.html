<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ГРАДО Студия</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="errbar" style="display:none;background:#b3261e;color:#fff;padding:6px 12px;font-size:12px;"></div>
<header>
  <div class="logo">ГРАДО <span>Студия</span></div>
  <input id="project-name" value="Концепция развития территории" spellcheck="false">
  <div class="spacer"></div>
  <button id="btn-undo" title="Отменить (Cmd+Z)">↶</button>
  <button id="btn-redo" title="Вернуть (Cmd+Shift+Z)">↷</button>
  <button id="btn-demo" title="Заполнить примером">Демо</button>
  <button id="btn-nspd" title="Импортировать захват НСПД (JSON от расширения GRADO)">НСПД</button>
  <input id="nspd-file" type="file" accept=".json,application/json" hidden>
  <button id="btn-clear" title="Очистить холст">Очистить</button>
  <button id="btn-open" title="Открыть проект .grado">Открыть…</button>
  <input id="grado-file" type="file" accept=".grado" hidden>
  <button id="btn-grado" title="Сохранить проект (открывается в QGIS)">.grado</button>
  <button id="btn-album" class="primary" title="Собрать альбом АГК">Альбом PDF</button>
</header>
<div id="main">
  <nav id="toolbar">
    <button data-tool="select"   class="active" title="Выбор (V)">➤</button>
    <button data-tool="boundary" title="Граница территории (G)">▣</button>
    <button data-tool="zone"     title="Функциональная зона (Z)">▨</button>
    <button data-tool="restrict" title="Ограничение / ЗОУИТ (O)">◫</button>
    <button data-tool="building" title="Здание: протянуть — прямоугольник, клики — произвольный контур (B)">▭</button>
    <button data-tool="public"   title="Зона нежилых ОКС (P)">◧</button>
    <button data-tool="redline"  title="Красная линия (L)">╱</button>
    <button data-tool="social"   title="Соцобъект (S)">●</button>
    <button data-tool="measure"  title="Измерение (M)">⟷</button>
    <div class="divider"></div>
    <button id="btn-snap" class="active" title="Привязки (X)">⌖</button>
  </nav>
  <canvas id="cv"></canvas>
  <aside id="panel">
    <section id="props">
      <h3>Свойства</h3>
      <div id="props-body" class="muted">Ничего не выбрано</div>
    </section>
    <section>
      <h3>Слои</h3>
      <div id="layers-body"></div>
    </section>
    <section>
      <h3>Сетка и привязки</h3>
      <label>Шаг сетки, м
        <select id="grid-step">
          <option value="auto" selected>авто</option>
          <option value="1">1</option><option value="2">2</option>
          <option value="5">5</option><option value="10">10</option>
          <option value="20">20</option><option value="50">50</option>
        </select></label>
      <label class="chk"><input type="checkbox" id="grid-show" checked> показывать сетку</label>
      <label class="chk"><input type="checkbox" id="grid-snap" checked> привязка к сетке (C)</label>
      <label class="chk"><input type="checkbox" id="obj-snap" checked> привязка к объектам (X)</label>
    </section>
    <section>
      <h3>Параметры расчёта</h3>
      <label>Плотность, тыс. м²/га
        <input id="p-density" type="number" value="25" min="1" max="60" step="0.5"></label>
      <label>Доля жилья в СПП, %
        <input id="p-ratio" type="number" value="80" min="0" max="100" step="1"></label>
    </section>
    <section id="tep">
      <h3>ТЭП <span id="tep-status" class="muted"></span></h3>
      <div id="tep-fact"></div>
      <div id="tep-body" class="muted">Начертите границу территории</div>
    </section>
  </aside>
</div>
<footer>
  <span id="st-coords">x: — y: —</span>
  <span id="st-grid"></span>
  <span id="st-snap"></span>
  <span id="st-core">ядро: …</span>
  <span id="st-bridge"></span>
  <span id="st-toast" style="color:#12a150;font-weight:600"></span>
  <span class="spacer"></span>
  <span id="st-hint">V G Z O B P L S M · Shift — орто · цифры+Enter — длина · R — поворот · ⌘D — дубликат · стрелки — сдвиг · F — вписать · X/C — привязки · Esc — отмена</span>
</footer>
<script src="app.js"></script>
</body>
</html>
