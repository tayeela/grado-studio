[package]
name = "grado_geom_rs"
version = "0.1.0"
edition = "2021"
description = "Геометрическое ядро ГРАДО на Rust: порт core/geom (affine, curves, path, overlay, snap, coverage)"

[dependencies]
geo = "0.33"
rstar = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
