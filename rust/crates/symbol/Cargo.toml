[package]
name = "grado_symbol"
version = "0.1.0"
edition = "2021"
description = "Слои знака ГРАДО (план 08.11.2026, шаг 3): стопка частей стиля (линия, полоса внутрь, штриховка, значки вдоль) → операции рендера в мм листа — один код для печати (пластина) и экрана (WebAssembly)"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
