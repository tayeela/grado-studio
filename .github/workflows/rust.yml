name: Rust (ядро и сверка с Python)

# Ядро на Rust (rust/): cargo test всех крейтов, сборка модуля grado_rs (maturin), набор core/compute/tests
# на Python-движке и на Rust (GRADO_COMPUTE=rust), пластина карты (render_plate) из печати ГРАДО 2, сверка ТЭП и геометрии
# с Python-эталоном через CLI (rust/parity).
# Колёса grado_rs для macOS arm64/x86_64, Windows и Linux — задача wheels: при каждом пуше в main с правкой Rust (и вручную, Run workflow);
# задача release кладёт их в релиз GitHub grado-rs-v<версия крейта py>, откуда их ставит сама программа (apps/grado2/rs_wheel.py).
# Правка Rust, которая меняет модуль, поднимает version в rust/crates/py/Cargo.toml и WANT в rs_wheel.py: иначе у пользователей останется прежнее колесо.

on:
  pull_request:
    paths:
      - "rust/**"
      - "core/compute/**"
      - "core/geom/**"
      - "apps/grado2/layout_io.py"
      - "apps/grado2/tests/test_map_plate.py"
      - "apps/grado2/rs_wheel.py"
      - ".github/workflows/rust.yml"
  push:
    branches:
      - main
      - team/t60
    paths:
      - "rust/**"
      - "core/compute/**"
      - "core/geom/**"
      - "apps/grado2/layout_io.py"
      - "apps/grado2/rs_wheel.py"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test (compute, geom, plate, symbol, py)
        working-directory: rust
        run: cargo test --workspace
      - name: Модуль grado_rs (maturin) и shapely для сверки геометрии
        run: |
          python -m pip install -q "maturin>=1.5,<2" "shapely==2.2.0"
          maturin build --release -m rust/crates/py/Cargo.toml -o /tmp/wheels
          python -m pip install -q /tmp/wheels/grado_rs-*.whl
      - name: core/compute/tests — Python-движок и сверка с Rust
        run: PYTHONPATH=core/compute python -m unittest discover -s core/compute/tests
      - name: core/compute/tests — весь набор на Rust (GRADO_COMPUTE=rust)
        run: |
          GRADO_COMPUTE=rust PYTHONPATH=core/compute python -c "import grado_compute as g; assert g.BACKEND == 'rust', g.BACKEND"
          GRADO_COMPUTE=rust PYTHONPATH=core/compute python -m unittest discover -s core/compute/tests
      - name: Пластина карты на Rust (render_plate) из печати ГРАДО 2
        run: |
          python -m pip install -q -r apps/grado2/requirements.txt
          python -c "import grado_rs; assert hasattr(grado_rs, 'render_plate')"
          python -m unittest apps/grado2/tests/test_map_plate.py
      - name: Слои знака на Rust (crates/symbol) = эталон Python; модуль WebAssembly для экрана собирается
        run: |
          python -c "import grado_rs; assert hasattr(grado_rs, 'parts_ops')"
          python -m unittest apps/grado2/tests/test_symparts.py
          rustup target add wasm32-unknown-unknown
          (cd rust && cargo build --release --target wasm32-unknown-unknown -p grado_symbol)
      - name: Сверка CLI с Python (rust/parity)
        working-directory: rust
        run: |
          cargo build --release
          python parity/dump_reference.py .. /tmp/par/py
          python -I parity/run_rs_dumps.py /tmp/par/rs .. /tmp/par/py
          python -I parity/compare.py /tmp/par/py /tmp/par/rs
          python parity/geom/dump_reference_geom.py .. /tmp/par/gpy
          python -I parity/geom/run_rs_dumps.py /tmp/par/grs ..
          python -I parity/geom/compare.py /tmp/par/gpy /tmp/par/grs

  wheels:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }      # сайт grado.tailink.tech
          - { os: macos-15, target: aarch64, test: true }                            # Mac на Apple M
          - { os: macos-15, target: x86_64, test: false }                            # Mac на Intel (сборка на M, без запуска)
          - { os: windows-latest, target: x64, test: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release -m rust/crates/py/Cargo.toml -o dist
      - name: Колесо ставится и считает так же, как Python
        if: matrix.test
        shell: bash
        run: |
          python -m pip install -q dist/grado_rs-*.whl
          python -c "import grado_rs; print('grado_rs', grado_rs.__version__)"
          PYTHONPATH=core/compute python -m unittest discover -s core/compute/tests -p test_rust_backend.py
      - uses: actions/upload-artifact@v4
        with:
          name: grado_rs-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  release:
    needs: [test, wheels]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Релиз grado-rs-v<версия> с колёсами (его читает apps/grado2/rs_wheel.py)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/crates/py/Cargo.toml | head -1)
          W=$(sed -n 's/^WANT = "\([^"]*\)".*/\1/p' apps/grado2/rs_wheel.py)
          [ "$V" = "$W" ] || { echo "версия крейта $V ≠ WANT $W в rs_wheel.py"; exit 1; }
          ls -l dist
          gh release view "grado-rs-v$V" >/dev/null 2>&1 || gh release create "grado-rs-v$V" --title "grado_rs $V" \
            --notes "Модуль Rust ГРАДО 2 (grado_rs $V): колёса macOS arm64/x86_64, Windows x64, Linux x86_64. Ставит сама программа (apps/grado2/rs_wheel.py)." --latest=false
          gh release upload "grado-rs-v$V" dist/*.whl --clobber
