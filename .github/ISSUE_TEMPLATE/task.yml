name: Задача
description: Работа команды: доработка программы, исправление, порядок в репозитории
title: ""
labels: ["задача"]
body:
  - type: markdown
    attributes:
      value: |
        Разделы те же, что в задании агенту (`docs/team/prompts/implement.md`): руководитель переносит их в задание как есть.
        Обязательны цель, проверка и результат; остальное — когда есть что сказать.
        Пишите словами владельца. Незнакомое сокращение (АГК, сущпол, СПРИТ, «лист 5») — сначала `docs/wiki/glossary.md`,
        работа с альбомом — сначала `docs/wiki/album-rules.md`. Лист называйте по названию («сущпол», «ортофотоплан»), номер — только «в выдаче».
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: |
        Что сейчас (видно на экране, на листе, в файле; снимок или страница PDF) и что должно быть. Чем результат является и чем нет
        (например: «правка окна Слои, а не новое окно»). Слова владельца — дословно, в кавычках, с датой.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: |
        Где работает: сервер и ядро, новый интерфейс, редактор листов, выгрузка. Какая готовая библиотека берётся (`docs/product/engine-map.md`);
        своё пишется только для команд в духе AutoCAD, координат, инсоляции и правил альбома.
  - type: textarea
    id: architecture
    attributes:
      label: Архитектура
      description: Один источник правды, общая функция для экрана и выгрузки, что должно оставаться верным (старые и замороженные листы, PPTX наравне с PDF).
  - type: textarea
    id: data
    attributes:
      label: Модель данных
      description: Что добавляется в проект (объекты, поля, значения по умолчанию) и как откроется проект, сохранённый раньше.
  - type: textarea
    id: phases
    attributes:
      label: Фазы
      description: |
        Фаза 1 — пронумерованные пункты, каждый проверяемый; всё готово и проверено до фазы 2.
        Фаза 2 — что потом. Одна фаза — так и написать.
  - type: textarea
    id: out
    attributes:
      label: Вне объёма
      description: Чего не делать, даже если хочется. Упомянутое в интерфейсе, но не сделанное — надпись «Пока нет», без пустых кнопок. Чего не трогать.
  - type: textarea
    id: check
    attributes:
      label: Проверка
      description: |
        Что запустить на самом деле: `tools/gate.sh` (`E2E=1`), тесты чистых функций, живой сценарий на копии проекта по шагам,
        снимок экрана, сравнение листов альбома (`tools/album_check.py`).
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Результат
      description: |
        Что владелец увидит на экране, когда готово — одной-двумя фразами, без программистских слов; по этому принимают работу.
        Отчёт: «Работает (проверено)» — только прошедшее проверку, «Не сделано», «Известные ограничения».
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Источники
      description: |
        Образец (картинка, страница альбома-образца, ссылка на лист; «нет образца» — тоже ответ), связанные задачи и PR,
        страницы вики (`docs/wiki/files.md` подскажет, где что лежит), ТЗ в `docs/specs/`.
